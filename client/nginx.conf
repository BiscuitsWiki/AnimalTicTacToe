# AnimalTicTacToe H5 静态托管 + 同源反向代理
# 客户端按同源相对地址访问（见 client/src/config.ts）：
#   /ws /uploads /auth /pieces /game /admin → 转发到 server 容器
# 因此对外只需 80/443 一个入口，HTTPS 域名或 Cloudflare Tunnel 均可直接套用。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── WebSocket：升级头透传（关键），idle 超时放宽到 1h（房间 TTL 2h 内不掉线）──
    location ^~ /ws {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 后端 REST API + UGC 图片 + 运营后台（^~ 优先于静态资源正则，避免 /uploads/*.png 被静态 location 截走）──
    location ^~ /uploads {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    location ^~ /admin {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    location ^~ /auth {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    location ^~ /pieces {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        # 与服务端 multer 限制（2MB）对齐
        client_max_body_size 3m;
    }

    location ^~ /game {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    # ── 带哈希的静态资源长缓存 ──
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 兜底（路由为 hash 模式，正常不会走到；保险起见）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
